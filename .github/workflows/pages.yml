# SPDX-License-Identifier: AGPL-3.0-or-later
# Builds, checks and deploys the warpcad.com home page to GitHub Pages (TODO/build-021).
name: pages

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # The GA4 measurement ID is an Actions variable (public, but kept out of source). Unset means no analytics.
      - run: npm run build
        env:
          GA_MEASUREMENT_ID: ${{ vars.GA_MEASUREMENT_ID }}
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      # The screenshot baselines are macOS renders; the Linux runner's text rasterises differently, so the
      # picture-stable test is run locally only until Linux baselines exist (TODO/build-022).
      - run: node --test scripts/cname.test.mjs && npx playwright test --project=chromium-phone --project=chromium-tablet --project=chromium-laptop --grep-invert picture-stable
      # The Playwright webServer rebuilds dist/ without the ID and with the help fixture, so the deployed
      # build is made again here, last, with the real configuration.
      - run: npm run build && npm run check:offline
        env:
          GA_MEASUREMENT_ID: ${{ vars.GA_MEASUREMENT_ID }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4

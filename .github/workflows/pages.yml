# Builds and deploys the warpcad.com home page to GitHub Pages (TODO/build-021).
# Manual only: Actions → pages → Run workflow, from main. It runs no tests; the pre-push hook
# (.githooks/pre-push, scripts/test-stamp.mjs) checks they passed on the commit that was pushed.
name: pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # The pre-push gate only covers main, so refuse to deploy any other branch.
      - name: Refuse to deploy a branch other than main
        if: github.ref != 'refs/heads/main'
        run: echo "::error::Pages deploys main only (ran from ${{ github.ref }})" && exit 1
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # The GA4 measurement ID is an Actions variable (public, but kept out of source). Unset means no analytics.
      - run: npm run build
        env:
          GA_MEASUREMENT_ID: ${{ vars.GA_MEASUREMENT_ID }}
      - run: npm run check
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
